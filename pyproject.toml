[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jobhunt"
version = "0.1.0"
description = "Local AI Job Search Harness"
authors = [
    {name = "JobHunt Team"},
]
readme = "README.md"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.12"
dependencies = [
    "textual",
    "openai",
    "httpx",
    "python-docx",
    "pydantic",
    "rich",
    "numpy",
    "playwright",
]

[dependency-groups]
dev = [
    "pytest",
]

[project.scripts]
jobhunt = "jobhunt:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
